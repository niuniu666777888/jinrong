services:
  mvp:
    build: ..
    image: jinrong/mvp:latest
    container_name: jinrong-mvp
    ports:
      - "8080:8080"
    environment:
      MVP_HOST: "0.0.0.0"
      MVP_PORT: "8080"
      MVP_DB: "/data/mvp.db"
      # 生产必须显式设置：决定核验凭证的签名密钥
      MVP_SECRET: "${MVP_SECRET:?请先在 .env 里设置 MVP_SECRET}"
      # 留空则用 mock 模型；接真实模型时填下面几项
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_BASE_URL: "${LLM_BASE_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-}"
    volumes:
      - mvp-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mvp-data:
