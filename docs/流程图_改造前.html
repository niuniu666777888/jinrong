<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>改造前：人工对账与差错处理流程</title>
<style>
  html,body{margin:0;padding:0;background:#f6f8fc}
  svg{display:block;font-family:'Microsoft YaHei','PingFang SC',-apple-system,sans-serif}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780">
  <rect width="1180" height="780" fill="#f6f8fc"/>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa6bb"/>
    </marker>
  </defs>
  <text x="56" y="42" font-size="21" font-weight="700" fill="#1b2330">改造前：人工对账与差错处理流程</text>
  <text x="56" y="66" font-size="13" fill="#6b7686">现状：2 家渠道、日均 80 万笔交易、对账员每天约 5 小时查异常；差异处理靠 Excel 台账与人盯</text>
  <line x1="56" y1="84" x2="1124" y2="84" stroke="#c0392b" stroke-width="2" opacity=".55"/>

  <g>
    <rect x="56" y="108" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="133.0" r="13" fill="#1f3864"/>
    <text x="82" y="138.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">1</text>
    <text x="106" y="138.5" font-size="15" fill="#1b2330">日切：渠道出具对账单（T+1）</text>
  </g>
  <path d="M 242.0 158 L 242.0 167" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="174" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="199.0" r="13" fill="#1f3864"/>
    <text x="82" y="204.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">2</text>
    <text x="106" y="204.5" font-size="15" fill="#1b2330">下载账单 → 导入 Excel</text>
  </g>
  <path d="M 242.0 224 L 242.0 233" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="240" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="265.0" r="13" fill="#1f3864"/>
    <text x="82" y="270.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">3</text>
    <text x="106" y="270.5" font-size="15" fill="#1b2330">逐笔比对：交易号 / 金额 / 日期</text>
  </g>
  <path d="M 242.0 290 L 242.0 299" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="306" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="331.0" r="13" fill="#1f3864"/>
    <text x="82" y="336.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">4</text>
    <text x="106" y="336.5" font-size="15" fill="#1b2330">差异定位：翻内部流水、找渠道确认</text>
  </g>
  <path d="M 242.0 356 L 242.0 365" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="372" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="397.0" r="13" fill="#1f3864"/>
    <text x="82" y="402.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">5</text>
    <text x="106" y="402.5" font-size="15" fill="#1b2330">判定差错类型，登记 Excel 台账</text>
  </g>
  <path d="M 242.0 422 L 242.0 431" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="438" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="463.0" r="13" fill="#1f3864"/>
    <text x="82" y="468.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">6</text>
    <text x="106" y="468.5" font-size="15" fill="#1b2330">主管复核（口头确认或直接代审）</text>
  </g>
  <path d="M 242.0 488 L 242.0 497" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="504" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="529.0" r="13" fill="#1f3864"/>
    <text x="82" y="534.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">7</text>
    <text x="106" y="534.5" font-size="15" fill="#1b2330">账务调整 / 补单 / 退款</text>
  </g>
  <path d="M 242.0 554 L 242.0 563" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="570" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="595.0" r="13" fill="#1f3864"/>
    <text x="82" y="600.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">8</text>
    <text x="106" y="600.5" font-size="15" fill="#1b2330">归档结案</text>
  </g>
  <path d="M 434 265.0 H 468" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="265.0" r="3" fill="#c0392b"/>
  <text x="476" y="263.0" font-size="13" font-weight="600" fill="#c0392b">跨日退款、手续费合并入账</text>
  <text x="476" y="281.0" font-size="12.5" font-weight="400" fill="#c0392b">→ 逐笔比对稳定失败</text>
  <text x="476" y="299.0" font-size="12.5" font-weight="400" fill="#c0392b">日均约 180 笔未解释差异</text>
  <path d="M 434 331.0 H 468" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="331.0" r="3" fill="#c0392b"/>
  <text x="476" y="329.0" font-size="13" font-weight="600" fill="#c0392b">口径靠人问</text>
  <text x="476" y="347.0" font-size="12.5" font-weight="400" fill="#c0392b">渠道按结算日、商户按支付日</text>
  <text x="476" y="365.0" font-size="12.5" font-weight="400" fill="#c0392b">一次确认往往要 2–3 天</text>
  <path d="M 434 463.0 H 468" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="463.0" r="3" fill="#c0392b"/>
  <text x="476" y="461.0" font-size="13" font-weight="600" fill="#c0392b">建单人与复核人常为同一人</text>
  <text x="476" y="479.0" font-size="12.5" font-weight="400" fill="#c0392b">无签核痕迹，事后无法证明</text>
  <text x="476" y="497.0" font-size="12.5" font-weight="400" fill="#c0392b">谁复核的说不清</text>
  <path d="M 434 529.0 H 468" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="529.0" r="3" fill="#c0392b"/>
  <text x="476" y="527.0" font-size="13" font-weight="600" fill="#c0392b">超过 7 天窗口就只能内部消化</text>
  <text x="476" y="545.0" font-size="12.5" font-weight="400" fill="#c0392b">没有前置提醒，发现即超期</text>

  <rect x="56" y="642" width="1068" height="86" rx="10"
        fill="#fdf1ef" stroke="#e0b4ac" stroke-width="1.4"/>
  <rect x="56" y="642" width="6" height="86" rx="3" fill="#c0392b"/>
  <text x="78" y="668" font-size="14" font-weight="700" fill="#a3291d">
    典型事件（来自资金风险经理访谈）：</text>
  <text x="78" y="692" font-size="13" fill="#7a3a31">
    2026-10-27 微信渠道一笔 5,000 元长款，因手工比对漏看，9 天后才在月度复盘中发现。</text>
  <text x="78" y="713" font-size="13" fill="#7a3a31">
    此时已过渠道 7 天争议窗口，无法追偿，5,000 元只能由公司内部消化——这正是「改造后」要前置拦截的问题。</text>
</svg>
</body></html>
