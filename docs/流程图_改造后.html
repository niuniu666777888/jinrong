<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>改造后：系统辅助的对账与差错处理流程</title>
<style>
  html,body{margin:0;padding:0;background:#f6f8fc}
  svg{display:block;font-family:'Microsoft YaHei','PingFang SC',-apple-system,sans-serif}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" viewBox="0 0 1180 780">
  <rect width="1180" height="780" fill="#f6f8fc"/>

  <defs>
    <marker id="arrowhead" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#9aa6bb"/>
    </marker>
  </defs>
  <text x="56" y="42" font-size="21" font-weight="700" fill="#1b2330">改造后：系统辅助的对账与差错处理流程</text>
  <text x="56" y="66" font-size="13" fill="#6b7686">目标：自动匹配 + 只读线索排序 + 凭证化建单 + 强制双人复核；AI 不产生资金结论</text>
  <line x1="56" y1="84" x2="1124" y2="84" stroke="#1f3864" stroke-width="2" opacity=".55"/>

  <g>
    <rect x="56" y="108" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="133.0" r="13" fill="#1f3864"/>
    <text x="82" y="138.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">1</text>
    <text x="106" y="138.5" font-size="15" fill="#1b2330">自动拉取账单（T+1，记录哈希与接收时间）</text>
  </g>
  <path d="M 242.0 158 L 242.0 167" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="174" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="199.0" r="13" fill="#1f3864"/>
    <text x="82" y="204.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">2</text>
    <text x="106" y="204.5" font-size="15" fill="#1b2330">主键 / 时区统一，规则自动匹配</text>
  </g>
  <path d="M 242.0 224 L 242.0 233" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="240" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="265.0" r="13" fill="#1f3864"/>
    <text x="82" y="270.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">3</text>
    <text x="106" y="270.5" font-size="15" fill="#1b2330">未匹配记录进入差异池（pending）</text>
  </g>
  <path d="M 242.0 290 L 242.0 299" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="306" width="372" height="50" rx="9"
          fill="#f2f7ff" stroke="#9db8e8" stroke-width="1.4"/>
    <circle cx="82" cy="331.0" r="13" fill="#1f6f8b"/>
    <text x="82" y="336.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">4</text>
    <text x="106" y="336.5" font-size="15" fill="#1b2330">AI 辅助：条款检索 + 线索排序（只读）</text>
  </g>
  <path d="M 242.0 356 L 242.0 365" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="372" width="372" height="50" rx="9"
          fill="#f2f7ff" stroke="#9db8e8" stroke-width="1.4"/>
    <circle cx="82" cy="397.0" r="13" fill="#1f6f8b"/>
    <text x="82" y="402.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">5</text>
    <text x="106" y="402.5" font-size="15" fill="#1b2330">人工核验：窗口 / 金额校验 → 签发凭证</text>
  </g>
  <path d="M 242.0 422 L 242.0 431" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="438" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="463.0" r="13" fill="#1f3864"/>
    <text x="82" y="468.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">6</text>
    <text x="106" y="468.5" font-size="15" fill="#1b2330">建单（金额服务端重查，凭证一次性）</text>
  </g>
  <path d="M 242.0 488 L 242.0 497" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="504" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="529.0" r="13" fill="#1f3864"/>
    <text x="82" y="534.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">7</text>
    <text x="106" y="534.5" font-size="15" fill="#1b2330">提交复核（四眼：系统强制换人）</text>
  </g>
  <path d="M 242.0 554 L 242.0 563" stroke="#9aa6bb" stroke-width="1.6" marker-end="url(#arrowhead)"/>

  <g>
    <rect x="56" y="570" width="372" height="50" rx="9"
          fill="#ffffff" stroke="#cfd6e4" stroke-width="1.4"/>
    <circle cx="82" cy="595.0" r="13" fill="#1f3864"/>
    <text x="82" y="600.0" text-anchor="middle"
          font-size="13" font-weight="600" fill="#ffffff">8</text>
    <text x="106" y="600.5" font-size="15" fill="#1b2330">关单，全链路事件留痕</text>
  </g>
  <path d="M 434 265.0 H 468" stroke="#1e7d54" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="265.0" r="3" fill="#1e7d54"/>
  <text x="476" y="263.0" font-size="13" font-weight="600" fill="#1e7d54">差异实时可见</text>
  <text x="476" y="281.0" font-size="12.5" font-weight="400" fill="#1e7d54">不再依赖人工翻找</text>
  <text x="476" y="299.0" font-size="12.5" font-weight="400" fill="#1e7d54">当日即可定位</text>
  <path d="M 434 331.0 H 468" stroke="#1e7d54" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="331.0" r="3" fill="#1e7d54"/>
  <text x="476" y="329.0" font-size="13" font-weight="600" fill="#1e7d54">AI 只读边界</text>
  <text x="476" y="347.0" font-size="12.5" font-weight="400" fill="#1e7d54">只给线索不给结论</text>
  <text x="476" y="365.0" font-size="12.5" font-weight="400" fill="#1e7d54">建议必须能点回原记录</text>
  <path d="M 434 397.0 H 468" stroke="#1e7d54" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="397.0" r="3" fill="#1e7d54"/>
  <text x="476" y="395.0" font-size="13" font-weight="600" fill="#1e7d54">两道硬拦截</text>
  <text x="476" y="413.0" font-size="12.5" font-weight="400" fill="#1e7d54">超 7 天窗口直接不通过</text>
  <text x="476" y="431.0" font-size="12.5" font-weight="400" fill="#1e7d54">&gt;3,000 元标高风险并抄送</text>
  <path d="M 434 463.0 H 468" stroke="#1e7d54" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="463.0" r="3" fill="#1e7d54"/>
  <text x="476" y="461.0" font-size="13" font-weight="600" fill="#1e7d54">跳过核验建单做不到</text>
  <text x="476" y="479.0" font-size="12.5" font-weight="400" fill="#1e7d54">HMAC 凭证 + 状态机</text>
  <text x="476" y="497.0" font-size="12.5" font-weight="400" fill="#1e7d54">一笔差异只能建一张单</text>
  <path d="M 434 529.0 H 468" stroke="#1e7d54" stroke-width="1.2" stroke-dasharray="4 3" opacity=".8"/>
  <circle cx="437" cy="529.0" r="3" fill="#1e7d54"/>
  <text x="476" y="527.0" font-size="13" font-weight="600" fill="#1e7d54">复核人 ≠ 建单人</text>
  <text x="476" y="545.0" font-size="12.5" font-weight="400" fill="#1e7d54">服务端比对，不靠前端隐藏按钮</text>
  <text x="476" y="563.0" font-size="12.5" font-weight="400" fill="#1e7d54">复核动作进事件表</text>

  <rect x="56" y="642" width="1068" height="86" rx="10"
        fill="#eef7f2" stroke="#a9cfbc" stroke-width="1.4"/>
  <rect x="56" y="642" width="6" height="86" rx="3" fill="#1e7d54"/>
  <text x="78" y="668" font-size="14" font-weight="700" fill="#17694a">
    同一笔典型事件，在改造后的走向：</text>
  <text x="78" y="692" font-size="13" fill="#2f5a4a">
    5,000 元长款在 T+1 自动对账时即进入差异池，第 2 天核验时命中「>3,000 元」告警并抄送风险经理，</text>
  <text x="78" y="713" font-size="13" fill="#2f5a4a">
    仍在 7 天窗口内完成建单与复核，可正常向渠道追偿——从「发现即超期」变成「当天发现、次日处置」。</text>
</svg>
</body></html>
