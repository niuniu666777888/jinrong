name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # 两套测试分开跑：它们各自有一个名为 app 的模块（交付版 webapp/app.py 与
      # src/app/），同一进程里同时 import 会互相覆盖，必须分进程执行。
      - name: Run tests (delivery)
        run: pytest

      - name: Run tests (MVP)
        run: pytest src/tests

      - name: Run tests (analysis)
        run: pytest analysis/tests
