<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支付对账与差错追踪流程图（标准符号）</title>
<style>
  body{margin:0;background:#f4f6f9;font-family:"Microsoft YaHei","PingFang SC",sans-serif;padding:28px 14px;}
  .wrap{max-width:780px;margin:0 auto;background:#fff;border:1px solid #e5e9ef;border-radius:14px;padding:22px;}
  h1{font-size:20px;text-align:center;color:#16324f;margin:0 0 4px;}
  .sub{text-align:center;font-size:12.5px;color:#6b7280;margin-bottom:14px;}
  svg{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:#4b5563;margin-top:12px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .sw{width:16px;height:12px;border:1.5px solid #3b6ea5;background:#eef4ff;display:inline-block;border-radius:2px;}
  .sw-d{width:14px;height:14px;background:#fff8e6;border:1.5px dashed #c9a227;transform:rotate(45deg);display:inline-block;}
  .sw-h{width:16px;height:12px;border:2px dashed #d9822b;background:#fdf1e3;display:inline-block;border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>支付对账与差错追踪流程图</h1>
  <div class="sub">矩形＝处理步骤 · 菱形＝判断节点 · 橙色虚线框＝需要人为判断 / 人工决策的点</div>
  <svg viewBox="0 0 760 1060" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
      </marker>
    </defs>

    <!-- ===== 主干 ===== -->
    <!-- R1 -->
    <rect x="195" y="24" width="210" height="56" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="300" y="48" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16324f">① 日切拉单</text>
    <text x="300" y="68" text-anchor="middle" font-size="12" fill="#4b5563">定时任务按渠道+币种下载账单</text>

    <line x1="300" y1="80" x2="300" y2="116" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- R2 -->
    <rect x="195" y="118" width="210" height="56" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="300" y="142" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16324f">② 解析入库 · 建批次</text>
    <text x="300" y="162" text-anchor="middle" font-size="12" fill="#4b5563">解析文件→统一结构入库，防重复对账</text>

    <line x1="300" y1="174" x2="300" y2="210" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- R3 -->
    <rect x="195" y="212" width="210" height="56" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="300" y="236" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16324f">③ 双向匹配核对（自动）</text>
    <text x="300" y="256" text-anchor="middle" font-size="12" fill="#4b5563">明细逐笔匹配 + 总额/笔数/状态核对</text>

    <line x1="300" y1="268" x2="300" y2="282" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- D1 菱形：账实一致？ -->
    <polygon points="300,284 395,332 300,380 205,332" fill="#fff8e6" stroke="#c9a227" stroke-width="1.8"/>
    <text x="300" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d1a">账实是否一致？</text>
    <text x="300" y="348" text-anchor="middle" font-size="11.5" fill="#8a6d1a">（系统自动比对结果）</text>

    <!-- D1 是 → 右侧对平结算 -->
    <line x1="395" y1="332" x2="488" y2="332" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#ah)"/>
    <text x="442" y="324" text-anchor="middle" font-size="12" font-weight="700" fill="#2e8b57">是 · 对平</text>

    <!-- R-A 对平结算 -->
    <rect x="490" y="304" width="210" height="56" rx="8" fill="#e9f7ef" stroke="#2e8b57" stroke-width="1.8"/>
    <text x="595" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e6b43">生成结算流水 / 付款文件</text>
    <text x="595" y="348" text-anchor="middle" font-size="12" fill="#4b5563">笔数·金额·状态全部一致</text>

    <line x1="595" y1="360" x2="595" y2="432" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#ah)"/>

    <!-- 结束：归档 -->
    <ellipse cx="595" cy="470" rx="105" ry="34" fill="#e9f7ef" stroke="#2e8b57" stroke-width="2"/>
    <text x="595" y="466" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e6b43">结束：平账归档留痕</text>
    <text x="595" y="486" text-anchor="middle" font-size="11.5" fill="#4b5563">供合规审计</text>

    <!-- D1 否 ↓ -->
    <line x1="300" y1="380" x2="300" y2="406" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="318" y="398" font-size="12" font-weight="700" fill="#d9822b">否 · 差异</text>

    <!-- R4 差错池 -->
    <rect x="195" y="408" width="210" height="52" rx="8" fill="#fdf1e3" stroke="#d9822b" stroke-width="1.8"/>
    <text x="300" y="432" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a85d17">④ 汇入差错数据池</text>
    <text x="300" y="451" text-anchor="middle" font-size="11.5" fill="#4b5563">该渠道暂不生成结算流水</text>

    <line x1="300" y1="460" x2="300" y2="492" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- R5 工单凭证 -->
    <rect x="195" y="494" width="210" height="52" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="300" y="518" text-anchor="middle" font-size="14.5" font-weight="700" fill="#16324f">⑤ 建工单 · 上传凭证</text>
    <text x="300" y="537" text-anchor="middle" font-size="11.5" fill="#4b5563">渠道记录/内部订单/汇率手续费截图</text>

    <line x1="300" y1="546" x2="300" y2="562" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- D2 菱形：在途时间差？ -->
    <polygon points="300,564 395,612 300,660 205,612" fill="#fff8e6" stroke="#c9a227" stroke-width="1.8"/>
    <text x="300" y="608" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d1a">是否为在途时间差？</text>
    <text x="300" y="628" text-anchor="middle" font-size="11.5" fill="#8a6d1a">（系统可自动判定）</text>

    <!-- D2 是 → 右侧自动对平 -->
    <line x1="395" y1="612" x2="488" y2="612" stroke="#2e8b57" stroke-width="1.8" marker-end="url(#ah)"/>
    <text x="442" y="604" text-anchor="middle" font-size="12" font-weight="700" fill="#2e8b57">是</text>
    <rect x="490" y="586" width="210" height="52" rx="8" fill="#e9f7ef" stroke="#2e8b57" stroke-width="1.8"/>
    <text x="595" y="610" text-anchor="middle" font-size="14" font-weight="700" fill="#1e6b43">自动对平 · 清除差异</text>
    <text x="595" y="629" text-anchor="middle" font-size="11.5" fill="#4b5563">回溯窗口（如7天）内自动销账</text>
    <path d="M595,638 L595,660 L300,660" fill="none" stroke="#2e8b57" stroke-width="1.4" stroke-dasharray="5 4"/>

    <!-- D2 否 ↓ -->
    <line x1="300" y1="660" x2="300" y2="682" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="318" y="676" font-size="12" font-weight="700" fill="#d9822b">否</text>

    <!-- R6 人工定位 -->
    <rect x="195" y="684" width="210" height="52" rx="8" fill="#fdf1e3" stroke="#d9822b" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="300" y="708" text-anchor="middle" font-size="14.5" font-weight="700" fill="#a85d17">⑥ 人工定位差异原因</text>
    <text x="300" y="727" text-anchor="middle" font-size="11.5" fill="#4b5563">查内部流水·查渠道报文·对接机构</text>

    <line x1="300" y1="736" x2="300" y2="762" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

    <!-- D3 菱形：人工决策（重点） -->
    <polygon points="300,764 400,822 300,880 200,822" fill="#fdecea" stroke="#d9822b" stroke-width="2.4" stroke-dasharray="7 4"/>
    <text x="300" y="812" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c0392b">⑦ 人工决策（人为判断）</text>
    <text x="300" y="832" text-anchor="middle" font-size="12" fill="#c0392b">判定差错类型与责任方</text>

    <!-- D3 三分支处理动作 -->
    <!-- 左：长款 -->
    <line x1="200" y1="822" x2="150" y2="822" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="150" y1="822" x2="150" y2="892" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="55" y="894" width="190" height="54" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="150" y="918" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324f">长款（多收）</text>
    <text x="150" y="938" text-anchor="middle" font-size="11.5" fill="#4b5563">补单 / 退款</text>

    <!-- 中：短款 -->
    <line x1="300" y1="880" x2="300" y2="892" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="205" y="894" width="190" height="54" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="300" y="918" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324f">短款（少收）</text>
    <text x="300" y="938" text-anchor="middle" font-size="11.5" fill="#4b5563">调单追款 / 补偿扣款</text>

    <!-- 右：金额状态费率 -->
    <line x1="400" y1="822" x2="450" y2="822" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="450" y1="822" x2="450" y2="892" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ah)"/>
    <rect x="355" y="894" width="190" height="54" rx="8" fill="#eef4ff" stroke="#3b6ea5" stroke-width="1.8"/>
    <text x="450" y="918" text-anchor="middle" font-size="13.5" font-weight="700" fill="#16324f">金额/状态/费率/汇率</text>
    <text x="450" y="938" text-anchor="middle" font-size="11.5" fill="#4b5563">订正 / 修正重算</text>

    <!-- 汇合到复核 -->
    <path d="M150,948 L150,990 L300,990" fill="none" stroke="#6b7280" stroke-width="1.4"/>
    <path d="M300,948 L300,990" fill="none" stroke="#6b7280" stroke-width="1.4"/>
    <path d="M450,948 L450,990 L300,990" fill="none" stroke="#6b7280" stroke-width="1.4"/>
    <line x1="300" y1="990" x2="300" y2="1008" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ah)"/>

    <rect x="205" y="1010" width="190" height="44" rx="8" fill="#e9f7ef" stroke="#2e8b57" stroke-width="2"/>
    <text x="300" y="1037" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e6b43">复核平账 · 归档留痕</text>
  </svg>

  <div class="legend">
    <span><i class="sw"></i>矩形＝处理步骤</span>
    <span><i class="sw-d"></i>菱形＝判断节点</span>
    <span><i class="sw-h"></i>橙色虚线＝人为判断 / 人工决策点</span>
  </div>
</div>
</body>
</html>
